name: rusemeva-transcribe

# Job paralel untuk transcribe (Whisper) + description
# Dipicu oleh record.yml bersamaan dengan rusemeva-encode
# Jalan di runner terpisah (concurrent slot 2)

permissions:
  contents: write

on:
  repository_dispatch:
    types: [encode-request]
  workflow_dispatch:
    inputs:
      filename:
        description: 'Original filename in temp release'
        required: true
      chat_id:
        description: 'Telegram chat id'
        required: true
      release_tag:
        description: 'Temp release tag'
        required: true
      duration:
        description: 'Actual duration seconds'
        required: true
      human_duration:
        description: 'Human duration label'
        required: false
        default: 'n/a'
      orv_id:
        required: false
        default: ''
      source:
        required: false
        default: 'unknown'

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "filename=${{ inputs.filename }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ inputs.chat_id }}" >> $GITHUB_OUTPUT
            echo "human_duration=${{ inputs.human_duration }}" >> $GITHUB_OUTPUT
            echo "duration=${{ inputs.duration }}" >> $GITHUB_OUTPUT
            echo "release_tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "orv_id=${{ inputs.orv_id }}" >> $GITHUB_OUTPUT
            echo "source=${{ inputs.source }}" >> $GITHUB_OUTPUT
          else
            echo "filename=${{ github.event.client_payload.filename }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
            echo "human_duration=${{ github.event.client_payload.human_duration }}" >> $GITHUB_OUTPUT
            echo "duration=${{ github.event.client_payload.duration }}" >> $GITHUB_OUTPUT
            echo "release_tag=${{ github.event.client_payload.release_tag }}" >> $GITHUB_OUTPUT
            echo "orv_id=${{ github.event.client_payload.orv_id }}" >> $GITHUB_OUTPUT
            echo "source=${{ github.event.client_payload.source }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr > /dev/null 2>&1 || true
          pip install openai-whisper --quiet 2>&1 | tail -2
          echo "✅ Dependencies installed"

      - name: Download ORIGINAL dari temp release
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.inputs.outputs.release_tag }}"
          FILE="${{ steps.inputs.outputs.filename }}"
          echo "📥 Download original: $TAG / $FILE"
          mkdir -p /tmp/transcribe
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --dir /tmp/transcribe --pattern "${FILE}*" --clobber 2>/dev/null || \
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --dir /tmp/transcribe --clobber 2>/dev/null || true
          ORIG=$(ls /tmp/transcribe/*.mp4 2>/dev/null | head -1)
          if [ -z "$ORIG" ]; then
            echo "❌ Original not found"
            exit 1
          fi
          echo "ORIG_FILE=$ORIG" >> $GITHUB_OUTPUT
          echo "✅ Original: $(ls -lh "$ORIG" | awk '{print $5}')"

      - name: Extract audio
        run: |
          ORIG="${{ steps.dl.outputs.ORIG_FILE }}"
          ffmpeg -hide_banner -loglevel error -y -i "$ORIG" \
            -vn -acodec pcm_s16le -ar 16000 -ac 1 /tmp/audio.wav
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/audio.wav 2>/dev/null | cut -d. -f1)
          echo "✅ Audio extracted: $(ls -lh /tmp/audio.wav | awk '{print $5}'), duration=${DUR}s"

      - name: Whisper transcription
        id: whisper
        run: |
          python3 scripts/transcribe_whisper.py \
            --input /tmp/audio.wav \
            --output-dir /tmp/transcribe_out \
            --language id

      - name: Generate description
        id: desc
        env:
          ORV_ID: ${{ steps.inputs.outputs.orv_id }}
          SOURCE: ${{ steps.inputs.outputs.source }}
          FILENAME: ${{ steps.inputs.outputs.filename }}
          HUMAN_DUR: ${{ steps.inputs.outputs.human_duration }}
          DURATION: ${{ steps.inputs.outputs.duration }}
        run: |
          python3 scripts/generate_description.py \
            --transcript /tmp/transcribe_out/transcript.json \
            --output /tmp/transcribe_out/description.md

      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ steps.inputs.outputs.chat_id }}
          ORV_ID: ${{ steps.inputs.outputs.orv_id }}
        run: |
          python3 scripts/send_transcript.py

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/audio.wav /tmp/transcribe /tmp/transcribe_out
          echo "✅ Cleanup done"
