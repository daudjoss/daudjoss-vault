name: Send File to Telegram (Bot API Server 2GB)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag yang berisi file'
        required: true
      chat_id:
        description: 'Telegram chat ID'
        required: true
        default: '2027652715'
      caption:
        description: 'Caption video'
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download file dari release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/files
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/files --clobber
          echo "=== Files downloaded ==="
          ls -lh /tmp/files/

      - name: Start Bot API Server (Docker, 2GB limit)
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          docker rm -f tg-bot-api 2>/dev/null || true
          rm -rf /tmp/tg-bot-api && mkdir -p /tmp/tg-bot-api
          docker run -d --name tg-bot-api -p 8081:8081 \
            -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            -v /tmp/tg-bot-api:/var/lib/telegram-bot-api \
            aiogram/telegram-bot-api:latest \
            --local -m 2097152000 --dir /var/lib/telegram-bot-api --http-port=8081 --verbosity=2
          echo "⏳ Menunggu Bot API Server siap..."
          for i in $(seq 1 45); do
            CODE=$(curl -s -o /tmp/getme.json -w "%{http_code}" "http://localhost:8081/bot${BOT_TOKEN}/getMe" 2>/dev/null)
            if [ "$CODE" = "200" ]; then echo "✅ Bot API Server ready"; break; fi
            sleep 2
          done

      - name: Kirim video ke Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          python3 << 'PYEOF'
          import os, glob, json, urllib.request

          bot = os.environ['BOT_TOKEN']
          chat = os.environ['CHAT_ID']
          caption = os.environ.get('INPUT_CAPTION', '')

          files = glob.glob('/tmp/files/*.mp4') + glob.glob('/tmp/files/*.mkv')
          if not files:
              print("❌ No video files found")
              exit(1)

          for f in sorted(files, key=os.path.getsize, reverse=True):
              size = os.path.getsize(f)
              name = os.path.basename(f)
              print(f"📤 Sending {name} ({size/1024/1024:.0f} MB)...")

              cap = caption or f"📦 {name}\n📏 {size/1024/1024:.0f} MB"

              for api in ['http://localhost:8081', 'https://api.telegram.org']:
                  url = f'{api}/bot{bot}/sendVideo'
                  try:
                      boundary = '----FormBoundary123'
                      parts = []
                      parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="chat_id"\r\n\r\n{chat}'.encode())
                      parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="caption"\r\n\r\n{cap}'.encode())
                      parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="parse_mode"\r\n\r\nHTML'.encode())
                      parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="video"; filename="{name}"\r\nContent-Type: video/mp4\r\n\r\n'.encode())
                      with open(f, 'rb') as vf:
                          parts.append(vf.read())
                      parts.append(f'\r\n--{boundary}--\r\n'.encode())
                      body = b''.join(parts)

                      req = urllib.request.Request(url, data=body, headers={
                          'Content-Type': f'multipart/form-data; boundary={boundary}'
                      })
                      with urllib.request.urlopen(req, timeout=900) as r:
                          resp = json.loads(r.read().decode())
                          if resp.get('ok'):
                              fid = resp.get('result', {}).get('video', {}).get('file_id', 'sent')
                              print(f'✅ Sent via {api} — file_id={fid[:30]}...')
                              break
                  except Exception as e:
                      err_body = ''
                      if hasattr(e, 'read'):
                          try: err_body = e.read().decode()[:200]
                          except: pass
                      print(f'⚠️ {api}: {e} {err_body}')
              else:
                  print(f'❌ Gagal kirim {name} via semua API')
          PYEOF
