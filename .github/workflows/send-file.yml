name: Send File to Telegram (Bot API Server 2GB)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag yang berisi file'
        required: true
      chat_id:
        description: 'Telegram chat ID'
        required: true
        default: '2027652715'
      caption:
        description: 'Caption video'
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download file dari release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/files
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/files --clobber
          echo "=== Files downloaded ==="
          ls -lh /tmp/files/

      - name: Start Bot API Server
        run: |
          # Download Bot API Server
          curl -fsSL -o /tmp/botapi.tar.gz \
            "https://github.com/nickoala/nickoala.github.io/raw/refs/heads/main/telegram-bot-api-8.2-linux-amd64.tar.gz" || \
          curl -fsSL -o /tmp/botapi.tar.gz \
            "https://github.com/nickoala/nickoala.github.io/raw/refs/heads/main/telegram-bot-api-linux-amd64.tar.gz" || true
          
          # Try alternative: install from Docker image extract
          if [ ! -s /tmp/botapi.tar.gz ]; then
            echo "Downloading pre-built Bot API Server..."
            apt-get update -qq && apt-get install -y -qq wget
            wget -q -O /tmp/bot-api-server \
              "https://github.com/nickoala/nickoala.github.io/raw/refs/heads/main/telegram-bot-api-8.2-linux-amd64.tar.gz" 2>/dev/null || true
          fi

          # Build from source as fallback
          if [ ! -s /tmp/botapi.tar.gz ]; then
            echo "Building Bot API Server from source..."
            apt-get install -y -qq git cmake gperf zlib1g-dev libssl-dev 2>/dev/null || true
            git clone --depth 1 https://github.com/nickoala/nickoala.github.io /tmp/botapi-src 2>/dev/null || true
          fi

          # Start server (use pre-compiled binary)
          if [ -f /tmp/botapi.tar.gz ]; then
            cd /tmp && tar xzf botapi.tar.gz 2>/dev/null || true
            ls /tmp/telegram-bot-api* 2>/dev/null
            /tmp/telegram-bot-api* --api-id=0 --api-hash=0 --http-port=8081 &
          else
            echo "Using direct API (50MB limit fallback)"
          fi
          sleep 3

      - name: Kirim video ke Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          python3 << 'PYEOF'
          import os, glob, json, urllib.request

          bot = os.environ['BOT_TOKEN']
          chat = os.environ['CHAT_ID']
          caption = os.environ.get('INPUT_CAPTION', '')

          files = glob.glob('/tmp/files/*.mp4') + glob.glob('/tmp/files/*.mkv')
          if not files:
              print("❌ No video files found")
              exit(1)

          for f in sorted(files, key=os.path.getsize, reverse=True):
              size = os.path.getsize(f)
              name = os.path.basename(f)
              print(f"📤 Sending {name} ({size/1024/1024:.0f} MB)...")

              cap = caption or f"📦 {name}\n📏 {size/1024/1024:.0f} MB"

              # Try local Bot API first (2GB), then public API (50MB)
              for api in ['http://localhost:8081', 'https://api.telegram.org']:
                  url = f'{api}/bot{bot}/sendVideo'
                  try:
                      boundary = '----FormBoundary123'
                      parts = []
                      # chat_id
                      parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="chat_id"\r\n\r\n{chat}'.encode())
                      # caption
                      parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="caption"\r\n\r\n{cap}'.encode())
                      # parse_mode
                      parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="parse_mode"\r\n\r\nHTML'.encode())
                      # video file
                      parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="video"; filename="{name}"\r\nContent-Type: video/mp4\r\n\r\n'.encode())
                      with open(f, 'rb') as vf:
                          parts.append(vf.read())
                      parts.append(f'\r\n--{boundary}--\r\n'.encode())
                      body = b''.join(parts)

                      req = urllib.request.Request(url, data=body, headers={
                          'Content-Type': f'multipart/form-data; boundary={boundary}'
                      })
                      with urllib.request.urlopen(req, timeout=600) as r:
                          resp = json.loads(r.read().decode())
                          if resp.get('ok'):
                              fid = resp.get('result', {}).get('video', {}).get('file_id', 'sent')
                              print(f'✅ Sent via {api} — file_id={fid[:20]}...')
                              break
                  except Exception as e:
                      print(f'⚠️ {api}: {e}')
              else:
                  print(f'❌ Gagal kirim {name} via semua API')
          PYEOF
