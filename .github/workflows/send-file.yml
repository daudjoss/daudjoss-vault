name: Send File to Telegram (Bot API Server 2GB)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag yang berisi file'
        required: true
      chat_id:
        description: 'Telegram chat ID'
        required: true
        default: '2027652715'
      caption:
        description: 'Caption video'
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download file dari release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/files
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/files --clobber
          echo "=== Files downloaded ==="
          ls -lh /tmp/files/

      - name: Start Bot API Server (Docker, 2GB limit)
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          docker rm -f tg-bot-api 2>/dev/null || true
          rm -rf /tmp/tg-bot-api && mkdir -p /tmp/tg-bot-api
          docker run -d --name tg-bot-api -p 8081:8081 \
            -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            -v /tmp/tg-bot-api:/var/lib/telegram-bot-api \
            aiogram/telegram-bot-api:latest \
            --local -m 2147483648 --dir /var/lib/telegram-bot-api --http-port=8081 --verbosity=2
          echo "⏳ Menunggu Bot API Server siap..."
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /tmp/getme.json -w "%{http_code}" "http://localhost:8081/bot${BOT_TOKEN}/getMe" 2>/dev/null)
            if [ "$CODE" = "200" ]; then echo "✅ Bot API Server ready"; break; fi
            sleep 2
          done
          # Verify local mode
          curl -s "http://localhost:8081/bot${BOT_TOKEN}/getMe" | python3 -c "import sys,json; d=json.load(sys.stdin); print('local_mode:', d.get('result',{}).get('can_read_all_group_messages', 'unknown'))" 2>/dev/null || true

      - name: Kirim video ke Telegram (curl)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          CAPTION: ${{ inputs.caption }}
        run: |
          for f in /tmp/files/*.mp4 /tmp/files/*.mkv; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f")
            NAME=$(basename "$f")
            echo "📤 Sending $NAME ($(( SIZE / 1024 / 1024 )) MB)..."
            
            CAP="${CAPTION:-📦 $NAME\n📏 $(( SIZE / 1024 / 1024 )) MB}"
            
            # Try local Bot API Server first (2GB limit)
            echo "Trying localhost:8081..."
            RESP=$(curl -s --max-time 900 \
              -X POST "http://localhost:8081/bot${BOT_TOKEN}/sendVideo" \
              -F "chat_id=${CHAT_ID}" \
              -F "caption=${CAP}" \
              -F "parse_mode=HTML" \
              -F "video=@${f}" 2>&1)
            
            OK=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok', False))" 2>/dev/null || echo "False")
            
            if [ "$OK" = "True" ]; then
              echo "✅ Sent via localhost:8081"
              echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('file_id:', d.get('result',{}).get('video',{}).get('file_id','?')[:50])" 2>/dev/null
              continue
            fi
            
            echo "⚠️ localhost gagal: ${RESP:0:200}"
            
            # Fallback to public API (50MB limit)
            echo "Trying api.telegram.org..."
            RESP2=$(curl -s --max-time 300 \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
              -F "chat_id=${CHAT_ID}" \
              -F "caption=${CAP}" \
              -F "parse_mode=HTML" \
              -F "video=@${f}" 2>&1)
            
            OK2=$(echo "$RESP2" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok', False))" 2>/dev/null || echo "False")
            
            if [ "$OK2" = "True" ]; then
              echo "✅ Sent via api.telegram.org"
            else
              echo "❌ Gagal kirim: ${RESP2:0:300}"
            fi
          done
