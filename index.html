<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rusemeva Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            color: #58a6ff;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #58a6ff;
        }
        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .section h2 {
            color: #c9d1d9;
            font-size: 16px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #30363d;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #21262d;
        }
        th {
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
        }
        td { font-size: 14px; }
        code {
            background: #21262d;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-success { background: #1a4d2e; color: #3fb950; }
        .badge-failure { background: #4d1a1a; color: #f85149; }
        .badge-cancelled { background: #3d3d3d; color: #8b949e; }
        .badge-in_progress { background: #1a3a4d; color: #58a6ff; }
        .footer {
            text-align: center;
            color: #484f58;
            font-size: 12px;
            margin-top: 32px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Rusemeva Dashboard</h1>
        <p class="subtitle">Last updated: 2026-07-28 03:01 WIB</p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value">0</div>
                <div class="stat-label">Total Rekaman</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">0</div>
                <div class="stat-label">Sukses</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">0</div>
                <div class="stat-label">Gagal</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">0%</div>
                <div class="stat-label">Success Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">0</div>
                <div class="stat-label">Encode</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">0</div>
                <div class="stat-label">Transcribe</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="section">
                <h2>🎬 Recent Recordings</h2>
                <table>
                    <tr><th></th><th>ID</th><th>Time</th><th>Status</th><th></th></tr>
                    
                </table>
            </div>

            <div class="section">
                <h2>🎞 Encode Jobs</h2>
                <table>
                    <tr><th></th><th>ID</th><th>Time</th><th>Status</th><th></th></tr>
                    
                </table>
            </div>
        </div>

        <div class="section">
            <h2>📦 Recent Releases</h2>
            <table>
                <tr><th>Tag</th><th>Size</th><th>Time</th></tr>
                
            </table>
        </div>

        <div class="footer">
            Rusemeva Vault &middot; <a href="https://github.com/daudjoss/daudjoss-vault">GitHub</a>
        </div>
    </div>
</body>
</html>
